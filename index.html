<script>

document.getElementById("codeForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const code = document.getElementById("winningCode").value.trim();

  try {

    const response = await fetch("https://ahmadn8n.duckdns.org/webhook/check-code", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ code })
    });

    let data = await response.json();

    console.log("RAW RESPONSE:", data);

    // 🔥 normalize (أهم جزء)
    if (Array.isArray(data)) {
      data = data[0];
    }

    if (typeof data === "string") {
      try {
        data = JSON.parse(data);
      } catch (e) {
        data = {};
      }
    }

    // 🔥 check success in multiple ways
    const isSuccess =
      data?.success === true ||
      data?.success === "true" ||
      (data?.message && data.message.toLowerCase().includes("won"));

    if (isSuccess) {

      localStorage.setItem("winnerCode", code);
      localStorage.setItem("prizeMessage", data.message || "");

      window.location.href = "https://ids-sw.github.io/2ndscratch-win/";

    } else {
      alert("Invalid code ❌");
    }

  } catch (err) {
    console.error(err);
    alert("Server connection error");
  }

});

</script>
